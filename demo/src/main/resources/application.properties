spring.application.name=demo
spring.kafka.bootstrap-servers=localhost:29092
spring.kafka.key-serializer=org.apache.kafka.common.serialization.LongSerializer
spring.kafka.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.acks=all
spring.kafka.consumer.group-id=client-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.LongDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.topic.client=clients
spring.kafka.topic.transaction=transactions

spring.datasource.driver=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/mydb
spring.datasource.username=myuser
spring.datasource.password=mypassword

